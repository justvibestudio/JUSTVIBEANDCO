<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — JUST VIBE & CO.</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="site-header"><a class="brand" href="../index.html" aria-label="JUST VIBE & CO."><img class="brand-logo" src="../assets/images/brand-logo.jpg" alt="JUST VIBE & CO. — Elevated Skincare"></a><a class="account-btn" href="../index.html">BACK TO SHOP</a></header><main class="section"><div class="section-head"><p class="eyebrow">SECURE CHECKOUT</p><h2>YOUR<br><span>ORDER.</span></h2></div><div class="checkout-layout"><section class="checkout-card"><h3>ORDER SUMMARY</h3><div id="checkoutItems"></div><div class="cart-total"><span>TOTAL</span><strong id="checkoutTotal">₹0</strong></div></section><section class="checkout-card"><h3>DELIVERY DETAILS</h3><form id="checkoutForm" class="contact-form"><label>Full name<input required name="name" placeholder="Your name"></label><label>Phone<input required name="phone" inputmode="tel" placeholder="10-digit mobile number"></label><label>Email<input required type="email" name="email" placeholder="you@email.com"></label><label>Address<textarea required name="address" rows="4" placeholder="Full delivery address"></textarea></label><button class="btn btn-dark" type="submit">CONTINUE TO PAYMENT →</button></form><p class="small" style="margin-top:15px">Razorpay integration is wired as a launch-ready hook. Add your Key ID and a secure backend order-creation endpoint before accepting live payments.</p><a class="whatsapp-cta" data-community target="_blank">Join WhatsApp Community →</a></section></div></main><div class="toast" id="toast"></div><script src="../js/config.js"></script><script src="../js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const c=JV.getCart(),box=document.getElementById('checkoutItems');box.innerHTML=c.length?c.map(i=>`<div class="ingredient"><div><strong>${i.name}</strong><span>${i.qty} × ${JV.money(i.price)}</span></div><b>${JV.money(i.price*i.qty)}</b></div>`).join(''):'<p>Your bag is empty. <a class="text-link" href="../index.html#shop">Shop now →</a></p>';document.getElementById('checkoutTotal').textContent=JV.money(c.reduce((s,i)=>s+i.price*i.qty,0));document.getElementById('checkoutForm').addEventListener('submit',e=>{e.preventDefault();if(!c.length){JV.toast('Add a product first.');return}const fd=new FormData(e.target),order='JV'+Date.now().toString().slice(-8);localStorage.setItem('jv_last_order',JSON.stringify({order,status:'Order received',name:fd.get('name'),total:c.reduce((s,i)=>s+i.price*i.qty,0),created:new Date().toISOString()}));JV.toast(`Order ${order} created in demo mode ✦`);setTimeout(()=>location.href='track.html?id='+order,700)})});</script></body></html>
