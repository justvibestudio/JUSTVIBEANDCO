<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — JUST VIBE & CO.</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="site-header"><a class="brand" href="../index.html" aria-label="JUST VIBE & CO."><img class="brand-logo" src="../assets/images/brand-logo.jpg" alt="JUST VIBE & CO. — Elevated Skincare"></a><a class="account-btn" href="../index.html">SHOP</a></header><main class="section"><div class="section-head"><p class="eyebrow">YOUR SPACE</p><h2>MY<br><span>VIBE.</span></h2></div><div class="checkout-card" style="max-width:620px;margin:auto"><div id="accountState"></div><form id="loginForm" class="contact-form"><label>Email<input type="email" name="email" required placeholder="you@email.com"></label><label>Password<input type="password" name="password" required placeholder="••••••••"></label><button class="btn btn-dark">SIGN IN →</button></form><p class="small" style="margin-top:15px">This static build stores a demo session in your browser. For real accounts, connect authentication + database on a secure backend.</p></div></main><div class="toast" id="toast"></div><script src="../js/config.js"></script><script src="../js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const state=document.getElementById('accountState'),form=document.getElementById('loginForm');function render(){const u=localStorage.getItem('jv_user');state.innerHTML=u?`<div class="ingredient"><div><strong>SIGNED IN</strong><span>${u}</span></div><button class="btn" id="logout" type="button">LOG OUT</button></div>`:'';document.getElementById('logout')?.addEventListener('click',()=>{localStorage.removeItem('jv_user');render();JV.toast('Signed out.')});if(u)form.style.display='none';else form.style.display='flex'}form.addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('jv_user',new FormData(form).get('email'));render();JV.toast('Signed in — demo mode ✦')});render()});</script></body></html>
